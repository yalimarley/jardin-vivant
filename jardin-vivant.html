<title>Jardin Vivant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Concept : carnet de jardinier. Le plan du jardin au centre, les tâches du jour à droite, les cartes comme des sachets de graines.
   Couleur : papier sauge, feuille profonde, rouge fruit pour ce qui presse, ambre pour l'optionnel. */
:root{
  --bg:#e8eee2; --surface:#f5f8ef; --surface-2:#dce6d3; --ink:#1a2a21; --ink-2:#4a5e51; --line:#c3d0ba;
  --leaf:#2d6a44; --leaf-2:#58975a; --fruit:#cc4a35; --sun:#b9831b; --water:#2f78ad; --soil:#6a4e39;
  --shadow:0 1px 2px rgba(26,42,33,.08),0 6px 18px rgba(26,42,33,.07);
  --dim:transparent; --on-leaf:#f4f9ef; --on-fruit:#fff;
  --font-d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --font-b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --font-m:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101a14; --surface:#18251d; --surface-2:#213227; --ink:#e6eee2; --ink-2:#a3b8a9; --line:#2d4236;
  --leaf:#86c993; --leaf-2:#4e9a60; --fruit:#f07b62; --sun:#efbb4b; --water:#74b6e8; --soil:#a68563;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --dim:rgba(8,16,12,.42); --on-leaf:#0f1d15; --on-fruit:#1b0b07; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a14; --surface:#18251d; --surface-2:#213227; --ink:#e6eee2; --ink-2:#a3b8a9; --line:#2d4236;
  --leaf:#86c993; --leaf-2:#4e9a60; --fruit:#f07b62; --sun:#efbb4b; --water:#74b6e8; --soil:#a68563;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --dim:rgba(8,16,12,.42); --on-leaf:#0f1d15; --on-fruit:#1b0b07; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;
  padding-block:0; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--leaf-2);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
.app{max-width:1280px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
svg{display:block}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* barre du haut */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px 24px;align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:26px;font-weight:800;line-height:1}
.brand small{display:block;font-family:var(--font-m);font-size:11px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.when{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:14px;color:var(--ink-2);min-width:0}
.when b{color:var(--ink);font-family:var(--font-d);font-size:17px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--leaf-2);display:block}
.gauges{display:flex;gap:10px;flex-wrap:wrap}
.gauge{min-width:128px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow)}
.gauge .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gauge span{font-size:12px;color:var(--ink-2);font-weight:600}
.gauge strong{font-family:var(--font-m);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--leaf-2)}
.bar.w>i{background:var(--water)} .bar.f>i{background:var(--fruit)}
.menu{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--leaf-2)}
.btn.primary{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--fruit);color:var(--fruit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}

/* scène */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.board{display:flex;flex-direction:column;gap:12px;min-width:0}
.res{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.res .items{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink);font-size:13px}
.pill.mat{cursor:pointer}
.pill.mat.on{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
.pill[disabled]{opacity:.5;cursor:not-allowed}
.hint{min-height:34px;display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:10px;background:var(--surface-2);font-size:14px}
.hint .btn{margin-left:auto}
.garden-wrap{border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface)}
#garden{width:100%;height:auto;max-height:76vh}
.cell{cursor:pointer}
.cell:focus-visible{outline:none}
.cell:focus-visible .frame{stroke:var(--leaf);stroke-width:4}
.frame{fill:none;stroke:transparent;stroke-width:3;pointer-events:none}
.cell:hover .frame{stroke:var(--leaf-2)}
.cell.sel .frame{stroke:var(--leaf);stroke-width:4}
.cell.free.pick .frame{stroke:var(--leaf);stroke-dasharray:6 5;stroke-width:3}
.gk{display:inline-block;vertical-align:-4px;margin-right:5px;flex:none}.atl,.cmp{cursor:pointer}.atl:hover,.atl:focus-visible{filter:brightness(1.07)}
.badge{cursor:pointer}
.badge:hover circle.bg{filter:brightness(1.1)}
.rain line{stroke:#fff;stroke-opacity:.55;stroke-width:1.4}
@media (prefers-reduced-motion:no-preference){.rain{animation:rain 1s linear infinite}@keyframes rain{from{transform:translate(0,-30px)}to{transform:translate(-12px,0)}}
  .flip-in{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}}

/* réserve de cartes */
.tray{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.tray h3{font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tray h3 small{font-family:var(--font-b);font-weight:500;color:var(--ink-2);font-size:13px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.strip .card{scroll-snap-align:start}
.empty{color:var(--ink-2);font-size:14px;padding:10px 2px}

/* carte-sachet */
.card{--tone:var(--leaf-2);position:relative;flex:none;width:138px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 0 9px;text-align:left;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.card.t-Racine{--tone:#e08a1e}.card.t-Herbacée{--tone:#4f9a4a}.card.t-Couvre-sol{--tone:#a3c23f}.card.t-Arbuste{--tone:#7b5aa6}.card.t-Grimpante{--tone:#2f8f8a}.card.t-Arbre{--tone:#a0522d}.card.t-mat{--tone:#8a7a5a}
.card.rar-Peu{border-color:var(--water)}.card.rar-Rare{border-color:var(--sun);box-shadow:0 0 0 2px color-mix(in srgb,var(--sun) 40%,transparent),var(--shadow)}
.card .art{height:92px;background:linear-gradient(180deg,color-mix(in srgb,var(--tone) 24%,var(--surface)),color-mix(in srgb,var(--tone) 8%,var(--surface)));position:relative;border-bottom:1.5px dashed color-mix(in srgb,var(--tone) 45%,var(--line))}
.card .art svg{width:100%;height:100%}
.card .now{position:absolute;left:6px;top:6px;background:var(--leaf);color:var(--on-leaf);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}
.card .no{background:var(--surface-2);color:var(--ink-2)}
.card .cnt{position:absolute;right:6px;top:6px;background:var(--ink);color:var(--bg);font-family:var(--font-m);font-size:12px;padding:0 7px;border-radius:999px;line-height:20px}
.card h4{font-size:15px;line-height:1.15;padding:8px 10px 0}
.card .lat{font-size:11.5px;font-style:italic;color:var(--ink-2);padding:0 10px;margin:1px 0 0;min-height:15px}
.card .tags{display:flex;gap:4px;padding:6px 10px 0;flex-wrap:wrap}
.card .tag{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--tone) 22%,var(--surface));color:var(--ink)}
.card .cal{margin:7px 10px 0}
button.card{cursor:pointer}
button.card:hover{border-color:var(--leaf-2)}
button.card.on{outline:3px solid var(--leaf);outline-offset:1px}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.cal i{height:9px;border-radius:2px;background:var(--surface-2);display:block;position:relative}
.cal i.s{background:var(--leaf-2)}.cal i.h{background:var(--fruit)}.cal i.sh{background:linear-gradient(135deg,var(--leaf-2) 50%,var(--fruit) 50%)}
.cal i.cur{outline:1.5px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-2);margin-top:6px;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* colonne latérale */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.panel>h2{font-size:20px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.panel>h2 small{font-family:var(--font-m);font-size:12px;font-weight:400;color:var(--ink-2)}
.grp{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 6px}
.task{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px}
.task:hover{border-color:var(--leaf-2)}
.task .disc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2)}
.task.p0 .disc{background:var(--fruit);color:var(--on-fruit)} .task.p0{border-color:color-mix(in srgb,var(--fruit) 55%,var(--line))}
.task.p1 .disc{background:var(--leaf);color:var(--on-leaf)}
.task.p2 .disc{background:color-mix(in srgb,var(--sun) 28%,var(--surface));color:var(--sun)}
.task b{display:block;font-weight:600;font-size:14.5px;line-height:1.25}
.task span.sub{display:block;font-size:12.5px;color:var(--ink-2)}
.done-box{background:color-mix(in srgb,var(--leaf-2) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--leaf-2) 50%,var(--line));border-radius:12px;padding:12px 14px;margin:8px 0}
.done-box h3{font-size:18px;margin-bottom:2px}
.done-box p{margin:0 0 10px;color:var(--ink-2);font-size:14px}
.fiche{display:flex;flex-direction:column;gap:10px}
.fiche .head{display:flex;gap:12px;align-items:center}
.fiche .head .art{width:84px;height:84px;border-radius:12px;background:var(--surface-2);flex:none;overflow:hidden}
.fiche .head .art svg{width:100%;height:100%}
.fiche h2{font-size:21px;line-height:1.1}
.fiche .lat{font-style:italic;color:var(--ink-2);font-size:13px}
.est{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:color-mix(in srgb,var(--sun) 22%,var(--surface));color:var(--ink);margin-top:3px}
.meters{display:grid;gap:7px}
.meter{display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:center;font-size:13px}
.meter span{color:var(--ink-2)} .meter b{font-family:var(--font-m);font-weight:500;font-size:12px}
.meter .bar{margin:0}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.notes li{display:flex;gap:8px;font-size:13.5px;line-height:1.35}
.notes .m{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.notes .good .m{background:var(--leaf-2);color:var(--on-leaf)}
.notes .bad .m{background:var(--fruit);color:var(--on-fruit)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.note-p{margin:0;font-size:13.5px;color:var(--ink-2)}
.empty-f{color:var(--ink-2);font-size:14px;margin:0}

/* fenêtres */
.veil{position:fixed;inset:0;background:rgba(10,18,13,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(720px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal>header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.modal h2{font-size:23px}
.x{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.pack{display:grid;place-items:center;gap:14px;padding:10px 0 4px;text-align:center}
.pack p{margin:0;color:var(--ink-2);max-width:42ch}
.deal{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,138px));gap:12px;justify-content:center;margin:6px 0 12px}
.flipper{perspective:900px;width:138px;height:250px;border:none;background:none;padding:0}
.flipper .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
.flipper.up .in{transform:rotateY(180deg)}
.flipper .face{position:absolute;inset:0;backface-visibility:hidden}
.flipper .front{transform:rotateY(180deg)}
.flipper .back{border-radius:14px;border:1.5px solid var(--leaf);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--leaf) 80%,#000) 0 10px,var(--leaf) 10px 20px);display:grid;place-items:center;color:var(--on-leaf)}
.flipper .card{width:138px;height:250px}
@media (prefers-reduced-motion:reduce){.flipper .in{transition:none}}
.kit{display:grid;gap:6px;margin:8px 0}
.ing{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.ing input{width:18px;height:18px;accent-color:var(--leaf)}
.ing .k{font-family:var(--font-m);font-size:13px;color:var(--ink-2)}
.sum{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2);margin:10px 0}
.sum .nm{font-family:var(--font-d);font-size:19px;font-weight:700}
.log{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.log li{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.log .d{font-family:var(--font-m);font-size:12px;color:var(--ink-2)}
.log .warn{color:var(--sun)} .log .bad{color:var(--fruit)}
.time{display:grid;gap:8px;margin-top:6px}
.time .row{display:flex;gap:8px;flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:min(560px,calc(100vw - 32px));text-align:center}
.foot{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:space-between}

@media (max-width:1040px){.stage{grid-template-columns:minmax(0,1fr)}.board,.side{display:contents}.res{order:1}#family{order:5}.hint{order:2}.wxalert{order:2}.garden-wrap{order:3}#today{order:4}#fiche{order:4}.tray{order:6}.foot{order:7}.top{grid-template-columns:1fr}.gauge{flex:1 1 120px}}
@media (max-width:520px){.brand h1{font-size:22px}.card{width:128px}.flipper,.flipper .card{width:128px}.deal{grid-template-columns:repeat(auto-fill,128px)}.modal{padding:14px}}

/* photos, herbier, décor animé */
.card .art{overflow:hidden}
.phimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface-2)}
.card .art .now,.card .art .cnt{z-index:2}
.fiche .head .phslot{width:84px;height:84px;border-radius:12px;overflow:hidden;position:relative;flex:none;background:var(--surface-2)}
.fiche .head .phslot:empty{display:none}
.cred{font-size:11.5px;opacity:.85}
.hbar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin:10px 0}
.hbar input[type=search]{flex:1 1 220px;min-width:0;font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hbar label{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.hlist{display:grid;gap:5px}
.hrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px}
.hrow:hover{border-color:var(--leaf-2)}
.hrow .hn b{display:block;font-size:14.5px}.hrow .hn i{font-size:12px;color:var(--ink-2)}
.hrow .hm{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.hb.ok{background:var(--leaf);color:var(--on-leaf)}
@media (max-width:520px){.hrow{grid-template-columns:1fr auto}.hrow .hm{display:none}}
@media (prefers-reduced-motion:no-preference){
.bfly{animation:bf 7s ease-in-out infinite}@keyframes bf{0%,100%{transform:translate(0,0)}25%{transform:translate(16px,-10px)}50%{transform:translate(32px,3px)}75%{transform:translate(14px,12px)}}
.smoke{animation:sm 5s ease-in-out infinite}@keyframes sm{0%{transform:translateY(0);opacity:.75}100%{transform:translateY(-14px);opacity:.1}}}

/* personnages */
.chr .leg,.chr .arm,.chr .tail,.chr .head{transform-box:fill-box}
.chr .leg{transform-origin:50% 8%}.chr .arm{transform-origin:50% 8%}.chr .tail{transform-origin:100% 100%}.chr .head{transform-origin:30% 80%}
.pop{opacity:0;transition:opacity .2s}.chr.work .pop{opacity:1}
.ripple{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
.chr.walk .l1,.chr.walk .l3{animation:stride .46s ease-in-out infinite alternate}.chr.walk .l2,.chr.walk .l4{animation:stride .46s ease-in-out infinite alternate-reverse}
.chr.walk .a1{animation:stride .46s ease-in-out infinite alternate-reverse}.chr.walk .a2{animation:stride .46s ease-in-out infinite alternate}
.doggy.walk .flip{animation:bob .23s ease-in-out infinite alternate}
.doggy .tail{animation:wag .4s ease-in-out infinite alternate}.doggy.walk .tail{animation-duration:.2s}
.doggy.rest .head{animation:nod 2.6s ease-in-out infinite}
.chr.work .a1{animation:dig .5s ease-in-out infinite alternate}.chr.work .pop{animation:float 1s ease-in-out infinite alternate}
.ripple{animation:rip 3.2s ease-out infinite}.ripple.r2{animation-delay:-1.6s}
@keyframes stride{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.6px)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes dig{from{transform:rotate(-10deg)}to{transform:rotate(55deg)}}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes rip{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.25);opacity:0}}}

  s += poly([f(L), f(B), f(up(B, H)), f(up(L, H))], '#c9a574') + poly([f(B), f(R), f(up(R, H)), f(up(B, H))], '#a8825a');

  s += poly([f(ap), f(Lo), f(Bo)], '#b0583a') + poly([f(ap), f(Bo), f(Ro)], '#8f4430');
